[project]
name = "sulteng"
version = "0.1.0"
description = "Near-real-time satellite fire detections for Central Sulawesi"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyproj>=3.6",
  "pyogrio>=0.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sulteng"]

[tool.pytest.ini_options]
testpaths = ["tests"]
