# All of Indonesia for the fire history, and the cities of the haze tab.
# source_name is the geoBoundaries ADM1 shapeName; name is the Indonesian name used as the key everywhere.
# geoBoundaries has 34 provinces: the six Papua provinces created in 2022 appear as Papua and West Papua.

archive_first = 2013      # first full year of the Suomi NPP archive
archive_last = 2025       # last yearly archive file built into data/public/history_archive.json
area_bbox = "94.5,-11.5,141.5,6.5"     # FIRMS area API box (west,south,east,north) for the current year
map_bbox = [95.0, -11.0, 141.0, 8.0]   # haze map and wind grid (west, south, east, north)

